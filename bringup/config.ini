# BINNER bring-up configuration. Flat key=value, '#' comments.
# Copy next to binner_bringup.py on the board's flash filesystem (or leave
# in the current directory when running from a PC via mpremote run).

# Label for this chip; overridden by main(chip_id=...) if given explicitly.
# chip_id = parv01

# Where to write binner_<chip_id>.csv (flash root by default).
out_dir = .

# tt-micropython-firmware v3.1.1 ships no ttgf26d shuttle index yet, so
# selection falls back in this order: force_shuttle (below, if set) ->
# tt.shuttle.find('binner') -> tt.shuttle.<project_name> -> tt.shuttle[tile_address].
project_name = tt_um_parv_b_binner
tile_address = 581

# Fallback/override: a project name OR a numeric shuttle index. Leave blank
# to use the normal find-by-name / address fallback above. Set this if the
# shuttle index 404s and the fallback address is also wrong for your board.
force_shuttle =

# Default measurement clock (Hz). Fmax sweeps use their own PWM range.
f_clk_default = 10000000
