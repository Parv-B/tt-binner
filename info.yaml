# Tiny Tapeout project information
project:
  title:        "BINNER: process monitor and speed-binning chip"      # Project title
  author:       "Parv Bhadra"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Ring-oscillator bank, paired counters, at-speed Fmax taps and LFSR self-test for post-silicon variation characterization"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     20000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_parv_b_binner"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "binner_ring.v"
    - "binner_dchain.v"
    - "binner_rcnt.v"
    - "binner_sync.v"
    - "binner_lfsr.v"
    - "binner_spi.v"
    - "binner_meas.v"
    - "binner_fmax.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SPI CS_N"
  ui[1]: "SPI SCK"
  ui[2]: "SPI MOSI"
  ui[3]: "PINMODE"
  ui[4]: "PM_SEL0"
  ui[5]: "PM_SEL1"
  ui[6]: "PM_SEL2"
  ui[7]: "FMAX_RUN / PM_BANK"

  # Outputs
  uo[0]: "LFSR_OUT"
  uo[1]: "CHA_DIV"
  uo[2]: "CHB_DIV"
  uo[3]: "SPI MISO"
  uo[4]: "BUSY"
  uo[5]: "FMAX_FAIL"
  uo[6]: "DONE"
  uo[7]: "DBG_BIT"

  # Bidirectional pins
  uio[0]: "DBG0"
  uio[1]: "DBG1"
  uio[2]: "DBG2"
  uio[3]: "DBG3"
  uio[4]: "DBG4"
  uio[5]: "DBG5"
  uio[6]: "DBG6"
  uio[7]: "DBG7"

# Do not change!
yaml_version: 6
